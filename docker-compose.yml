version: '3.8'

services:
  visionguard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: visionguard-platform
    ports:
      - "8000:8000"
    environment:
      - VG_HOST=0.0.0.0
      - VG_PORT=8000
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/status')"]
      interval: 30s
      timeout: 10s
      retries: 3
